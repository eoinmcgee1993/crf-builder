<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"
 width="640" height="640" role="img" aria-label="StreetSweeperCustoms phantom">
<title>StreetSweeperCustoms</title>
<defs>
  <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="14" result="b1"/>
    <feGaussianBlur stdDeviation="34" result="b2"/>
    <feMerge>
      <feMergeNode in="b2"/><feMergeNode in="b2"/>
      <feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <clipPath id="grinclip"><path d="M -206 58 C -128 112 -64 130 0 130 C 64 130 128 112 206 58 C 150 182 76 206 0 206 C -76 206 -150 182 -206 58 Z"/></clipPath>
  <radialGradient id="haze" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#7E22CE" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#7E22CE" stop-opacity="0"/>
  </radialGradient>
</defs><style>
  .glow  { animation: breathe 4.2s ease-in-out infinite; transform-origin: center; }
  .spark { animation: flick 5.5s ease-in-out infinite; }
  .haze  { animation: swell 6.8s ease-in-out infinite; transform-origin: center; }
  .w     { animation: drift 7s ease-in-out infinite; transform-origin: center; }
  .w1 { animation-duration: 8.4s; animation-delay: -1.1s; }
  .w2 { animation-duration: 6.2s; animation-delay: -2.7s; }
  .w3 { animation-duration: 9.1s; animation-delay: -0.6s; }
  .w4 { animation-duration: 7.6s; animation-delay: -3.4s; }
  @keyframes breathe { 0%,100% { opacity:.86; } 50% { opacity:1; } }
  @keyframes flick   { 0%,88%,100% { opacity:.25; } 92% { opacity:.95; } 95% { opacity:.4; } }
  @keyframes swell   { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes drift   { 0%,100% { opacity:.25; transform: translateY(0); }
                       50%     { opacity:.65; transform: translateY(-16px); } }
  /* A logo that moves is decoration; a logo that moves when someone asked it
     not to is a bug. Everything above is suppressed, nothing is hidden. */
  @media (prefers-reduced-motion: reduce) {
    .glow, .spark, .haze, .w { animation: none; }
    .spark { opacity: .45; }
  }
</style>
<rect width="640" height="640" rx="102" fill="#121316"/>
<ellipse class="haze" cx="320.0" cy="320.0" rx="294" ry="269" fill="url(#haze)"/>
<g class="face" transform="translate(320.0,348.8) scale(0.7273)">
  <g class="smoke" fill="none" stroke="#7E22CE" stroke-width="7"
     stroke-linecap="round" opacity="0.5"><path class="w w0" d="M -184 -62 C -232 -108 -214 -170 -158 -186 C -196 -156 -200 -116 -168 -92"/><path class="w w1" d="M  -96 -98 C -118 -156 -82 -212 -22 -214 C -74 -188 -88 -146 -78 -112"/><path class="w w2" d="M   24 -104 C  18 -172 66 -214 122 -206 C 70 -178 50 -140 50 -110"/><path class="w w3" d="M  148 -84 C  186 -130 240 -132 262 -96 C 220 -104 188 -88 170 -66"/><path class="w w4" d="M  206 -34 C  258 -42 290 -8 278 34 C 258 0 232 -12 200 -12"/><path class="w w0" d="M -210 -16 C -264 -10 -288 26 -270 62 C -254 26 -232 10 -202 6"/></g>
  <g class="glow" filter="url(#bloom)">
    <g fill="#A855F7">
      <path d="M -46 18 C -78 -26 -138 -74 -186 -56 C -168 -4 -96 38 -46 18 Z"/><path d="M 46 18 C 78 -26 138 -74 186 -56 C 168 -4 96 38 46 18 Z"/>
      <g clip-path="url(#grinclip)"><path d="M -206 58 C -128 112 -64 130 0 130 C 64 130 128 112 206 58 C 150 182 76 206 0 206 C -76 206 -150 182 -206 58 Z"/>
        <g fill="#121316"><rect x="-150.0" y="46" width="13" height="172"/><rect x="-100.0" y="46" width="13" height="172"/><rect x="-52.0" y="46" width="13" height="172"/><rect x="-4.0" y="46" width="13" height="172"/><rect x="44.0" y="46" width="13" height="172"/><rect x="92.0" y="46" width="13" height="172"/><rect x="142.0" y="46" width="13" height="172"/></g>
      </g>
    </g>
  </g>
  <g fill="#F43F5E" opacity="0.9" class="spark">
    <path d="M -150 -42 C -140 -30 -118 -14 -96 -6 C -124 -8 -146 -22 -150 -42 Z"/>
    <path d="M  150 -42 C  140 -30 118 -14 96 -6 C 124 -8 146 -22 150 -42 Z"/>
  </g>
</g>
</svg>